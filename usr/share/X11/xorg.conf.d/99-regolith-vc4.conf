# Raspberry Pi: use the vc4 display device as Xorg's primary GPU.
#
# The Pi exposes two DRM devices: vc4 (display) and v3d (render only). If Xorg
# picks v3d, lightdm shows a black screen with a blinking cursor. This section
# only matches when the vc4 kernel driver is loaded, so it has no effect on
# other hardware. It mirrors the config generated by Raspberry Pi's
# gldriver-test package for HDMI output.
Section "OutputClass"
  Identifier "vc4"
  MatchDriver "vc4"
  Driver "modesetting"
  Option "PrimaryGPU" "true"
EndSection
